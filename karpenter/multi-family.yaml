apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: multi-family
  annotations:
    kubernetes.io/description: Flexible general-purpose pool using D and E VM families
spec:
  limits:
    cpu: "128"
  disruption:
    budgets:
      - nodes: 20%
    consolidateAfter: 5m
    consolidationPolicy: WhenEmptyOrUnderutilized
  template:
    metadata:
      labels:
        workload.example.com/tier: general
        kubernetes.azure.com/ebpf-dataplane: cilium
        kubernetes.azure.com/mode: user
    spec:
      expireAfter: Never
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: kubernetes.io/os
          operator: In
          values: [linux]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: karpenter.azure.com/sku-family
          operator: In
          values:
            - D
            - E
      startupTaints:
        - key: node.cilium.io/agent-not-ready
          value: "true"
          effect: NoExecute