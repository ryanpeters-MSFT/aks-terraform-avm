trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: TerraformInstaller@1
    displayName: Install Terraform
    inputs:
      terraformVersion: 'latest'

  - task: AzureCLI@2
    displayName: Terraform init, plan, and apply
    inputs:
      azureSubscription: 'AKS'
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: '$(Build.SourcesDirectory)'
      inlineScript: |
        set -euo pipefail

        export ARM_CLIENT_ID="$AZURESUBSCRIPTION_CLIENT_ID"
        export ARM_TENANT_ID="$AZURESUBSCRIPTION_TENANT_ID"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
        export ARM_OIDC_AZURE_SERVICE_CONNECTION_ID="$AZURESUBSCRIPTION_SERVICE_CONNECTION_ID"
        export ARM_USE_OIDC=true
        export ARM_USE_AZUREAD=true

        terraform init -input=false \
          -backend-config="storage_account_name=terraformstaterjp" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=aks/terraform.tfstate"

        terraform validate
        terraform plan -input=false -var='group=rg-aks-terraform' -out=tfplan
        terraform apply -input=false -auto-approve tfplan
    env:
      ARM_OIDC_REQUEST_TOKEN: $(System.AccessToken)